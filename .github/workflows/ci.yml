name: Libre Continuum CI

on:
  push:
    branches:
      - main
      - feature/libre-continuum-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install static-check dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Domain repository recommendation and UI tests
        run: node --test tests/*.test.mjs

      - name: JavaScript syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Static application integrity
        run: python tests/static_check.py
